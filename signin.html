{% extends 'base.html' %}
{% block title %}Sign In{% endblock %}

{% block public %}
<div class="auth-page-wrapper">
  <div class="auth-card-container">
    <!-- Left: Port Supervisor with Tablet overlooking sunset terminal -->
    <div class="auth-image-pane">
      <img src="{{ url_for('static', filename='images/ui/signin_half_pure.png') }}" alt="Port Operations Supervisor with Tablet overlooking container terminal">
    </div>

    <!-- Right: Sign In Form -->
    <div class="auth-form-pane">
      <h2 class="auth-card-title">Sign In</h2>
      <p class="auth-card-subtitle">Access your port operations dashboard</p>

      {% if errors %}
      <div class="auth-alert-box" role="alert">
        {% for e in errors %}<div>{{ e }}</div>{% endfor %}
      </div>
      {% endif %}

      <form method="post" action="{{ url_for('auth.signin', next=request.args.get('next')) }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- Email Field with Mail Icon -->
        <div class="input-with-icon">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <input type="email" id="email" name="email" value="{{ email }}" placeholder="you@example.com" required autocomplete="email">
        </div>

        <!-- Password Field with Lock Icon & Eye Toggle -->
        <div class="input-with-icon">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="btn-password-toggle" onclick="togglePasswordVisibility('password', this)" aria-label="Toggle password visibility">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <!-- Remember Me and Forgot Password -->
        <div class="auth-row-options">
          <label class="remember-label">
            <input type="checkbox" name="remember" id="remember">
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-password-link">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button class="btn-auth-submit" type="submit">Sign In</button>

        <!-- Divider -->
        <div class="auth-or-divider">
          <span>or</span>
        </div>

        <!-- Continue with Google Button -->
        <button type="button" class="btn-google-auth">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          Continue with Google
        </button>

        <!-- Don't have an account link -->
        <p class="auth-switch-prompt">
          Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign Up</a>
        </p>
      </form>
    </div>
  </div>
</div>

<script>
function togglePasswordVisibility(fieldId, btn) {
  var input = document.getElementById(fieldId);
  if (!input) return;
  if (input.type === 'password') {
    input.type = 'text';
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
  } else {
    input.type = 'password';
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
  }
}
</script>
{% endblock %}
